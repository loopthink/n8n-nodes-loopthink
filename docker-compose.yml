# Local test rig: n8n with this node already loaded, plus an echo service to
# point tool calls at so a full round trip can be exercised without touching a
# real internal system.
#
#   npm run docker:up      build + start        → http://localhost:5678
#   npm run docker:down    stop and clean up
#
# The node is mounted from ./dist, so `npm run build` (or `npm run dev` in a
# second terminal) followed by a container restart picks up code changes.

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: loopthink-n8n
    ports:
      - '5678:5678'
    environment:
      # Load community nodes from a directory of their own rather than from
      # ~/.n8n/custom — that path sits inside the data volume, and the two mounts
      # would then shadow each other in ways that depend on mount ordering.
      N8N_CUSTOM_EXTENSIONS: /custom
      # Plain http on localhost: without this n8n sets Secure cookies and the
      # login form silently refuses to submit.
      N8N_SECURE_COOKIE: 'false'
      N8N_HOST: localhost
      N8N_PORT: '5678'
      N8N_PROTOCOL: http
      GENERIC_TIMEZONE: Europe/Berlin
      # Keeps the executions list readable while testing. The runner emits one
      # entry per handled tool call, which is exactly what you want to inspect.
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: all
      N8N_RUNNERS_ENABLED: 'true'
      N8N_DIAGNOSTICS_ENABLED: 'false'
    volumes:
      - n8n_data:/home/node/.n8n
      # Read-only: the container has no business writing back into your checkout.
      - ./dist:/custom/n8n-nodes-loopthink/dist:ro
      - ./package.json:/custom/n8n-nodes-loopthink/package.json:ro
    depends_on:
      - echo

  # Stands in for the customer's internal API. Echoes whatever it receives, so
  # you can watch masking work on a payload you control: POST the fields you want
  # to see redacted and read them back through the runner.
  echo:
    image: mendhak/http-https-echo:34
    container_name: loopthink-echo
    environment:
      HTTP_PORT: '8080'
    ports:
      - '8080:8080'

volumes:
  n8n_data:
