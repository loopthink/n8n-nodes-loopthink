# Local test rig: n8n with this node already loaded, plus an echo service to
# point tool calls at so a full round trip can be exercised without touching a
# real internal system.
#
#   npm run docker:up      build + start        → http://127.0.0.1:5680
#   npm run docker:down    stop and clean up
#
# The node is mounted from ./dist, so `npm run build` (or `npm run dev` in a
# second terminal) followed by a container restart picks up code changes.

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: loopthink-n8n
    ports:
      # 5680, not 5678 (a developer very likely already runs an n8n there) and
      # not 5679 (n8n's own task broker binds that internally — taking it makes
      # n8n collide with itself and refuse to start).
      #
      # Same port inside and out. n8n derives its editor base URL and cookie
      # settings from N8N_HOST/N8N_PORT — publish it under a different number and
      # the session cookie no longer matches the URL you actually open, which
      # surfaces as every /rest/ call returning 401 and a login that never takes.
      - '${LOOPTHINK_N8N_PORT:-5680}:${LOOPTHINK_N8N_PORT:-5680}'
    environment:
      # Load community nodes from a directory of their own rather than from
      # ~/.n8n/custom — that path sits inside the data volume, and the two mounts
      # would then shadow each other in ways that depend on mount ordering.
      N8N_CUSTOM_EXTENSIONS: /custom
      # Plain http on localhost: without this n8n sets Secure cookies and the
      # login form silently refuses to submit.
      N8N_SECURE_COOKIE: 'false'
      # 127.0.0.1, not localhost: cookies are scoped by host and ignore the port,
      # so an n8n-auth cookie from another n8n on localhost:5678 is also sent
      # here — and this instance, with its own encryption key, cannot verify it
      # and answers 401 to everything. A different host name keeps the two apart.
      N8N_HOST: 127.0.0.1
      N8N_PORT: '${LOOPTHINK_N8N_PORT:-5680}'
      N8N_PROTOCOL: http
      WEBHOOK_URL: 'http://127.0.0.1:${LOOPTHINK_N8N_PORT:-5680}/'
      GENERIC_TIMEZONE: Europe/Berlin
      # Keeps the executions list readable while testing. The runner emits one
      # entry per handled tool call, which is exactly what you want to inspect.
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: all
      N8N_DIAGNOSTICS_ENABLED: 'false'
    # Note: stock n8n logs "Failed to start Python task runner … Python 3 is
    # missing" on startup. It comes from the image, not from this node, and
    # nothing here depends on it. Left alone rather than papered over.
    volumes:
      - n8n_data:/home/node/.n8n
      # The whole package, not ./dist: `npm run build` starts with rimraf dist,
      # which deletes the very directory a bind mount points at. The container
      # then holds a dangling inode and every later rebuild is invisible to it —
      # silently, with the node still running the version loaded at startup.
      # Mounting a directory that survives the build avoids that entirely.
      #
      # Read-only: the container has no business writing back into your checkout.
      - .:/custom/n8n-nodes-loopthink:ro
    depends_on:
      - echo

  # Stands in for the customer's internal API. Echoes whatever it receives, so
  # you can watch masking work on a payload you control: POST the fields you want
  # to see redacted and read them back through the runner.
  echo:
    image: mendhak/http-https-echo:34
    container_name: loopthink-echo
    environment:
      HTTP_PORT: '8080'
    # Deliberately not published to the host: n8n reaches it over the compose
    # network at http://echo:8080, and binding it outside would collide with
    # whatever else already holds 8080 without buying anything.

volumes:
  n8n_data:
